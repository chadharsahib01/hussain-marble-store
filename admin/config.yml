backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

publish_mode: simple

collections:
  - name: "site_data"
    label: "Website Content"
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "data.json"
        format: json
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Title", name: "title", widget: "text" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Hero Background Image", name: "image", widget: "image", required: false }
          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Paragraph 1", name: "text1", widget: "text" }
              - { label: "Paragraph 2", name: "text2", widget: "text" }
              - { label: "About Image", name: "image", widget: "image", required: false }
          - label: "Collections"
            name: "collections"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Type", name: "type", widget: "string" }
              - { label: "Marble Photo", name: "image", widget: "image", required: false }
              - { label: "Fallback Gradient (optional)", name: "color", widget: "string", required: false }
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Icon", name: "icon", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "Gallery"
            name: "gallery"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Project Photo", name: "image", widget: "image", required: false }
              - { label: "Fallback Gradient (optional)", name: "color", widget: "string", required: false }
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Author", name: "author", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }

  - name: "custom_code"
    label: "⚡ Advanced Custom Code (Paste & Publish)"
    files:
      - name: "custom_code"
        label: "Custom CSS / HTML / JS"
        file: "custom-code.json"
        format: json
        fields:
          - { label: "Custom CSS (styling changes)", name: "customCss", widget: "code", code: "css", default: "", required: false }
          - { label: "Custom HTML (banner/footer/etc)", name: "customBodyHtml", widget: "code", code: "html", default: "", required: false }
          - { label: "Custom JavaScript (advanced - risky)", name: "customJs", widget: "code", code: "javascript", default: "", required: false }
